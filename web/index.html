<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atoms-Demo · AI Agent 平台笔试原型</title>
<style>
  :root{
    --bg:#0a0a0f; --panel:#101018; --panel2:#14141c; --border:#1f1f28;
    --text:#e5e5e5; --muted:#8a8a98; --dim:#6a6a78;
    --purple:#7c6cff; --blue:#5c8fff; --green:#34d399; --red:#f87171; --amber:#fbbf24;
    --grad:linear-gradient(90deg,var(--purple),var(--blue));
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.55;min-height:100vh}
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
  .logo{font-weight:800;font-size:19px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{font-weight:500;font-size:12px;color:var(--dim);margin-left:8px}
  .hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .meta{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:4px 10px;border-radius:99px}
  .meta b{color:var(--text)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;transition:.15s}
  .btn{background:var(--grad);color:#fff;font-weight:600;padding:10px 18px;font-size:14px}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .btn.ghost:hover{border-color:var(--purple);color:#fff}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
  .badge.running{background:rgba(124,108,255,.15);color:var(--purple)}
  .badge.done{background:rgba(52,211,153,.12);color:var(--green)}
  .badge.failed{background:rgba(248,113,113,.12);color:var(--red)}

  /* 首页：项目列表 */
  .grid-projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:24px 0}
  .proj{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:.15s}
  .proj:hover{border-color:var(--purple);transform:translateY(-2px)}
  .proj h3{font-size:15px;margin-bottom:6px}
  .proj p{font-size:12px;color:var(--dim)}
  .newproj{display:flex;gap:10px;margin-top:18px}

  /* 工作台 */
  main{display:grid;grid-template-columns:250px 1fr 430px;gap:16px;padding:16px 0 40px;align-items:start}
  @media(max-width:1100px){main{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .side .chat-item{padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:.15s}
  .side .chat-item:hover,.side .chat-item.active{border-color:var(--purple);color:var(--text)}
  .side .chat-item .t{color:var(--text);font-weight:600;display:block}
  .side .chat-item .d{font-size:11px;color:var(--dim)}

  .inputbar{display:flex;gap:10px}
  .inputbar input{flex:1;background:var(--panel2);border:1px solid var(--border);color:#fff;border-radius:12px;padding:13px 15px;font-size:14px;outline:none}
  .inputbar input:focus{border-color:var(--purple)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .chip{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer}
  .chip:hover{color:#fff;border-color:var(--purple)}

  .msg{display:flex;gap:10px;margin-bottom:10px}
  .msg .avatar{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .msg.user .avatar{background:var(--grad)}
  .msg.agent .avatar{background:var(--panel2);border:1px solid var(--border);color:var(--purple)}
  .msg .bubble{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:9px 13px;font-size:14px;max-width:560px}
  .think-dots::after{content:"";animation:dots 1.2s infinite}
  @keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}

  .task{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
  .task .chk{width:17px;height:17px;border-radius:5px;border:1px solid var(--border);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px}
  .task.done .chk{background:var(--green);border-color:var(--green);color:#0a0a0f}
  .task.blocked .chk{background:var(--red);border-color:var(--red)}
  .task .t-body{flex:1}
  .task .t-ins{font-size:13px;color:var(--text)}
  .task .t-acc{font-size:12px;color:var(--dim);margin-top:2px}
  .task.done{opacity:.75}

  .step{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);align-items:flex-start}
  .step:last-child{border-bottom:none}
  .step .ico{width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .step.ok .ico{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3)}
  .step.fail .ico{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3)}
  .step .s-body{flex:1;min-width:0}
  .step .s-title{font-size:13px;color:var(--text)}
  .step .s-detail{font-size:12px;color:var(--dim);margin-top:2px;word-break:break-all}
  .step .s-status{font-size:12px;margin-left:auto;padding-left:10px;white-space:nowrap}
  .step.ok .s-status{color:var(--green)}
  .step.fail .s-status{color:var(--red)}
  .step.active .ico{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}

  .preview{position:sticky;top:16px}
  .pv-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
  .pv-url{font-size:11px;color:var(--dim);font-family:Consolas,monospace;word-break:break-all}
  iframe{width:100%;height:520px;border:1px solid var(--border);border-radius:12px;background:#fff}
  .empty{color:var(--dim);text-align:center;padding:40px 10px;font-size:14px}
  .footer-note{color:var(--dim);font-size:12px;text-align:center;padding:16px 0 40px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logoHome">Atoms-Demo <small>AI Agent 平台笔试原型</small></div>
    <div class="hright">
      <span class="meta" id="metaProvider" style="display:none">LLM: <b id="mProvider">-</b></span>
      <span class="meta" id="metaProj" style="display:none">项目: <b id="mProj">-</b></span>
      <button class="btn ghost" id="btnHome" style="display:none">← 返回</button>
      <button class="btn" id="btnDownload" disabled>⬇ 下载产物</button>
    </div>
  </header>

  <!-- 首页：项目列表 -->
  <section id="viewHome">
    <div class="card" style="margin-top:20px">
      <h2>创建项目</h2>
      <div class="newproj">
        <input id="newProjName" placeholder="给项目起个名字，如：我的第一个 AI 落地页" style="flex:1;background:var(--panel2);border:1px solid var(--border);color:#fff;border-radius:12px;padding:13px 15px;font-size:14px;outline:none"/>
        <button class="btn" onclick="createProject()">开始构建</button>
      </div>
    </div>
    <h2 style="margin-top:22px;font-size:15px">我的项目</h2>
    <div class="grid-projects" id="projList"></div>
  </section>

  <!-- 工作台 -->
  <section id="viewWork" class="hidden">
    <div class="chips" id="chips">
      <span class="chip">做一个健身预约 SaaS 的落地页</span>
      <span class="chip">做一个跨境电商独立站</span>
      <span class="chip">做一个 AI 文案工具的产品页</span>
    </div>
    <div class="inputbar">
      <input id="input" placeholder="描述你想构建的产品，AI 团队会规划并生成…" />
      <button class="btn" id="btnBuild">提交需求</button>
    </div>

    <main>
      <div class="col side">
        <div class="card">
          <h2>会话历史</h2>
          <div id="chatList"></div>
        </div>
      </div>
      <div class="col">
        <div class="card"><h2>对话与计划</h2><div id="chatArea"></div></div>
        <div class="card hidden" id="planCard">
          <h2>AI 团队规划 <span class="badge running" id="planBadge">待批准</span></h2>
          <div id="tasks"></div>
          <div style="display:flex;gap:10px;margin-top:12px">
            <button class="btn" id="btnApprove">✅ 批准并执行</button>
          </div>
        </div>
        <div class="card hidden" id="runCard">
          <h2>Agent 执行 <span class="badge running" id="runBadge">running</span></h2>
          <div id="runlog"></div>
        </div>
      </div>
      <div class="col preview hidden" id="pvCol">
        <div class="pv-bar">
          <div>
            <div style="font-size:13px;color:var(--text);font-weight:600">产物预览</div>
            <div class="pv-url" id="pvUrl">-</div>
          </div>
          <span class="badge done" id="pvVer">v-</span>
        </div>
        <iframe id="pvFrame" src="" title="产物预览"></iframe>
      </div>
    </main>
  </section>

  <div class="footer-note">Atoms-Demo · AI Agent 平台笔试原型 · 真实链路：LLM 规划 → 代码生成 → 校验 → 部署 · 数据持久化 SQLite</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let projects = [], proj = null, chat = null, sse = null;
let allChats = [];

const el = (tag, cls, html) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html) d.innerHTML = html; return d; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url, opts) { const r = await fetch(url, opts); const j = await r.json(); if (j.code !== 0) throw new Error(j.message || "请求失败"); return j.data; }

/* ===== 首页 ===== */
async function loadHome() {
  $("viewWork").classList.add("hidden");
  $("viewHome").classList.remove("hidden");
  $("btnHome").style.display = "none";
  $("metaProj").style.display = "none";
  $("btnDownload").disabled = true;
  try {
    projects = await api("/api/projects");
  } catch (e) { projects = []; }
  const box = $("projList"); box.innerHTML = "";
  if (!projects.length) { box.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有项目，先在上面创建一个吧</div>'; return; }
  projects.forEach(p => {
    const d = el("div", "proj");
    d.innerHTML = `<h3>${esc(p.name)}</h3><p>${p.chatCount || 0} 个会话 · ${esc(p.created_at)}</p>`;
    d.onclick = () => openProject(p.id);
    box.appendChild(d);
  });
  try { const h = await api("/api/health"); if (h.llm) { $("metaProvider").style.display = ""; $("mProvider").textContent = h.llm; } } catch(_){}
}

async function createProject() {
  const name = $("newProjName").value.trim() || "我的 AI 项目";
  const p = await api("/api/projects", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
  openProject(p.id);
}

/* ===== 工作台 ===== */
async function openProject(pid) {
  const p = await api(`/api/projects/${pid}`);
  proj = p;
  $("viewHome").classList.add("hidden");
  $("viewWork").classList.remove("hidden");
  $("btnHome").style.display = "";
  $("metaProj").style.display = "";
  $("mProj").textContent = p.name;
  allChats = p.chats || [];
  renderChatList();
  // 若已有会话，加载最近一个
  if (allChats.length) loadChat(allChats[0].id); else resetWork();
}

function renderChatList() {
  const box = $("chatList"); box.innerHTML = "";
  if (!allChats.length) { box.innerHTML = '<div class="empty">暂无会话</div>'; return; }
  allChats.forEach(c => {
    const d = el("div", "chat-item" + (chat && chat.id === c.id ? " active" : ""));
    d.innerHTML = `<span class="t">${esc(c.title)}</span><span class="d">${c.status} · ${esc(c.created_at)}</span>`;
    d.onclick = () => loadChat(c.id);
    box.appendChild(d);
  });
}

function resetWork() {
  chat = null;
  $("chatArea").innerHTML = '<div class="empty">输入上方需求，AI 团队将规划并生成你的产品</div>';
  $("planCard").classList.add("hidden");
  $("runCard").classList.add("hidden");
  $("pvCol").classList.add("hidden");
  $("btnDownload").disabled = true;
  if (sse) { sse.close(); sse = null; }
}

async function loadChat(cid) {
  const d = await api(`/api/chats/${cid}`);
  chat = d.chat;
  renderChatList();
  renderMessages(d.messages);
  if (d.tasks && d.tasks.length) { renderTasks(d.tasks, d.chat.status); $("planCard").classList.remove("hidden"); }
  else $("planCard").classList.add("hidden");
  renderRuns(d.toolRuns || []);
  if (d.chat.status === "running") connectSSE(cid);
  if (d.version && d.version.status === "ready") showPreview(d.version);
}

/* ===== 需求 → 规划 ===== */
async function submitRequirement() {
  const text = $("input").value.trim();
  if (!text || !proj) return;
  $("btnBuild").disabled = true;
  // 创建会话
  let d;
  try {
    $("chatArea").innerHTML = `<div class="msg agent"><div class="avatar">AI</div><div class="bubble">正在调用 LLM 规划任务<span class="think-dots"></span></div></div>`;
    d = await api(`/api/projects/${proj.id}/chats`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ requirement: text }) });
  } catch (e) {
    $("chatArea").innerHTML = `<div class="msg agent"><div class="avatar">AI</div><div class="bubble" style="color:var(--red)">规划失败：${esc(e.message)}</div></div>`;
    $("btnBuild").disabled = false; return;
  }
  chat = d.chat;
  allChats.unshift({ id: chat.id, title: chat.title, status: chat.status, created_at: chat.created_at });
  renderChatList();
  renderMessages([{ role: "user", content: text }]);
  renderTasks(d.tasks, "awaiting_approval");
  $("planCard").classList.remove("hidden");
  $("planBadge").textContent = "待批准";
  $("btnApprove").disabled = false;
  $("btnBuild").disabled = false;
  $("input").value = "";
}

async function approve() {
  if (!chat) return;
  $("btnApprove").disabled = true;
  $("planBadge").textContent = "已批准，执行中…";
  document.querySelectorAll("#tasks .task").forEach(t => t.classList.add("done"));
  await api(`/api/chats/${chat.id}/approve`, { method: "POST" });
  $("runCard").classList.remove("hidden");
  $("runlog").innerHTML = "";
  connectSSE(chat.id);
}

/* ===== SSE 实时进度 ===== */
let doneReceived = false;
function connectSSE(cid) {
  if (sse) sse.close();
  doneReceived = false;
  $("runBadge").textContent = "running";
  $("runBadge").className = "badge running";
  sse = new EventSource(`/api/chats/${cid}/events`);
  sse.addEventListener("phase", (ev) => {
    const p = JSON.parse(ev.data);
    appendStep(p);
  });
  sse.addEventListener("done", (ev) => {
    doneReceived = true;
    const d = JSON.parse(ev.data);
    $("runBadge").textContent = "done";
    $("runBadge").className = "badge done";
    // 兜底：强制结束所有还在转圈的步骤
    document.querySelectorAll("#runlog .step.active").forEach(s => {
      s.classList.remove("active"); s.classList.add("ok");
      const st = s.querySelector(".s-status"); if (st) st.textContent = "✓";
    });
    if (d.url) showPreview({ site_path: d.url, version_no: d.version });
    $("btnDownload").disabled = false;
    sse.close();
  });
  sse.addEventListener("error", () => {
    if (!doneReceived) {
      $("runBadge").textContent = "failed";
      $("runBadge").className = "badge failed";
    }
  });
}

const STEP_ICONS = { generate: "🧠", checkui: "🖼️", deploy: "🚀", plan: "📋" };
function appendStep(p) {
  const box = $("runlog");
  // 若已存在同 phase 步骤 → 更新状态（不新建空行）
  if (p.phase) {
    const existing = [...box.children].find(s => s.dataset.phase === p.phase);
    if (existing) {
      if (p.status === "done" || p.status === "failed") {
        existing.classList.remove("active");
        existing.classList.add(p.status === "done" ? "ok" : "fail");
        const st = existing.querySelector(".s-status"); if (st) st.textContent = p.status === "done" ? "✓" : "✗";
        const dt = existing.querySelector(".s-detail");
        if (dt && p.output) dt.textContent += (dt.textContent ? " · " : "") + p.output;
      }
      return;
    }
  }
  const d = el("div", "step");
  d.dataset.phase = p.phase || "";
  d.innerHTML = `<div class="ico">${STEP_ICONS[p.phase] || "⚙️"}</div><div class="s-body"><div class="s-title">${esc(p.detail || p.phase || "执行")}</div><div class="s-detail">${esc(p.output || "")}</div></div><div class="s-status">${p.status === "done" ? "✓" : p.status === "failed" ? "✗" : "…"}</div>`;
  if (p.status === "done") d.classList.add("ok");
  if (p.status === "failed") d.classList.add("fail");
  if (!p.status || p.status === "running") d.classList.add("active");
  box.appendChild(d);
}

/* ===== 渲染 ===== */
function renderMessages(msgs) {
  const box = $("chatArea"); box.innerHTML = "";
  (msgs || []).forEach(m => {
    const d = el("div", "msg " + (m.role === "user" ? "user" : "agent"));
    d.innerHTML = `<div class="avatar">${m.role === "user" ? "我" : "AI"}</div><div class="bubble">${esc(m.content)}</div>`;
    box.appendChild(d);
  });
}

function renderTasks(tasks, status) {
  const box = $("tasks"); box.innerHTML = "";
  tasks.forEach((t, i) => {
    const d = el("div", "task");
    d.innerHTML = `<div class="chk"></div><div class="t-body"><div class="t-ins">${i + 1}. ${esc(t.instruction)}</div><div class="t-acc">验收：${esc(t.acceptance || "")}</div></div>`;
    if (t.status === "done" || status === "running" || status === "done") d.classList.add("done");
    box.appendChild(d);
  });
}

function renderRuns(runs) {
  const box = $("runlog"); box.innerHTML = "";
  if (runs.length) $("runCard").classList.remove("hidden");
  runs.forEach(r => appendStep({ phase: r.phase, detail: r.detail, status: r.status === "running" ? "running" : r.status, output: r.output }));
}

function showPreview(v) {
  const url = v.site_path || "";
  $("pvCol").classList.remove("hidden");
  $("pvUrl").textContent = url;
  $("pvVer").textContent = "v" + (v.version_no || "");
  $("pvFrame").src = url;
  $("btnDownload").disabled = false;
}

function download() {
  if (!chat) return;
  const a = document.createElement("a");
  a.href = `/api/artifact/download?chatId=${chat.id}`;
  a.download = "atoms-demo-artifact.zip";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ===== 事件 ===== */
$("btnHome").onclick = loadHome;
$("logoHome").onclick = loadHome;
$("btnBuild").onclick = submitRequirement;
$("btnApprove").onclick = approve;
$("btnDownload").onclick = download;
$("input").addEventListener("keydown", e => { if (e.key === "Enter") submitRequirement(); });
$("chips").addEventListener("click", e => { if (e.target.classList.contains("chip")) $("input").value = e.target.textContent; });

loadHome();
</script>
</body>
</html>
